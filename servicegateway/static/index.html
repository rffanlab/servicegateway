<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ServiceGateway · E5 网关管理</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/app.js"></script></head>
<body><section id="login" class="login-shell"><div class="login-card"><div class="brandmark">SG</div><p class="eyebrow">E5 · SERVICE CONTROL PLANE</p><h1>服务有序，流量可控。</h1><p class="muted">登录 ServiceGateway，管理服务、路由与发布。</p><form id="login-form"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary" type="submit">登录控制台</button></form><p class="hint">首次部署请使用 sgctl admin 创建管理员。没有默认口令。</p></div></section>
<div id="shell" hidden><aside><div class="logo"><span class="brandmark">SG</span><div><strong>ServiceGateway</strong><small>E5 网关管理</small></div></div><nav id="nav"><button data-view="overview" class="active">总览</button><button data-view="services">服务管理</button><button data-view="databases">业务数据库</button><button data-view="routes">网关路由</button><button data-view="releases">发布与回滚</button><button data-view="traffic">访问采样</button><button data-view="keys">API 密钥</button><button data-view="users">用户与权限</button><button data-view="audit">操作审计</button><button data-view="account">账户与证书</button></nav><div class="aside-bottom"><span class="dot"></span>MySQL · 独立 Nginx 实例<p>业务数据不会随服务注销删除。</p></div></aside><main><header><div><p class="eyebrow">SERVICEGATEWAY / CONTROL CENTER</p><h1 id="page-title">总览</h1></div><div class="toolbar"><span id="identity"></span><button id="refresh">刷新</button><button id="logout">退出</button></div></header><div id="notice" class="notice"></div><section id="content" aria-live="polite"></section><footer>配置保存为草稿，发布后才会改变网关流量。健康状态与进程状态分别展示。</footer></main></div>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields"></div><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button type="submit" class="primary" id="save-editor">保存</button></div></form></dialog><dialog id="reauth-dialog"><form id="reauth-form"><h2>敏感操作验证</h2><p>请输入当前账户密码。验证仅对当前会话短时有效。</p><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><div class="dialog-actions"><button type="button" id="reauth-cancel">取消</button><button type="submit" class="primary">验证</button></div></form></dialog><div id="toast" role="status" hidden></div></body></html>
