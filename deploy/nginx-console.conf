# Separate console entry. Does not replace E5's port 80 or existing gateways.
limit_req_zone $binary_remote_addr zone=sg_console_login:1m rate=5r/m;
server {
    listen 127.0.0.1:19091;
    server_name _;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 2m;
    access_log off;
    error_log /var/log/nginx/servicegateway-bootstrap-error.log crit;
    location ^~ /internal/ { return 404; }
    location = /api/auth/login {
        limit_req zone=sg_console_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:19092;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:19092;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
