/srv/e5-logs/servicegateway/edge-*.log {
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root servicegateway
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s USR1 --kill-who=main servicegateway-edge.service >/dev/null 2>&1 || true
    endscript
}
