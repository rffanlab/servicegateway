[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "servicegateway"
version = "0.1.0"
description = "MySQL-backed service and Nginx gateway control plane for E5"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.128,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0.40,<2.1", "PyMySQL[rsa]>=1.1,<2", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sgctl = "servicegateway.cli:main"

[tool.setuptools.packages.find]
include = ["servicegateway*"]

[tool.setuptools.package-data]
servicegateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
